[project]
name = "baseline-backend"
version = "0.1.0"
description = "Baseline: real-time voice-fraud co-pilot for bank call-center agents (backend)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "numpy==2.2.1",
    "soundfile==0.13.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "httpx==0.28.1",
    "openai==1.59.3",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Tests live at the repo root (tests/), backend modules are imported flat.
testpaths = ["../tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]
